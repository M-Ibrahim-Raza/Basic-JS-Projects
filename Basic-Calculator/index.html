<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header> </header>

  <main>
    <div id="calculator">
      <div id="buttonSection">
        <input id="resultDisplay" type="text" >
        <br>
         <div id="button">
          
          <button class="button" onclick="
            result=''
            document.querySelector('#resultDisplay').value=result
            ">C
          </button> 
          
          <button class="button" onclick="
            result=result+'1'
            document.querySelector('#resultDisplay').value=result
            ">1
          </button> 
          
          <button class="button" onclick="
            result=result+'2'
            document.querySelector('#resultDisplay').value=result
            ">2
          </button> 
         
          <button class="button" onclick="
            result=result+'+'
            document.querySelector('#resultDisplay').value=result
            ">+
          </button>
          
          <button class="button" onclick="
            result=result+'3'
            document.querySelector('#resultDisplay').value=result
            ">3
          </button> 
          
          <button class="button" onclick="
            result=result+'4'
            document.querySelector('#resultDisplay').value=result
            ">4
          </button>
          
          <button class="button" onclick="
            result=result+'-'
            document.querySelector('#resultDisplay').value=result
            ">-
          </button>
          
          <button class="button" onclick="
            result=result+'5'
            document.querySelector('#resultDisplay').value=result
            ">5
          </button>
          
          <button class="button" onclick="
            result=result+'6'
            document.querySelector('#resultDisplay').value=result
            ">6
          </button>

          <button class="button" onclick="
            result=result+'*'
            document.querySelector('#resultDisplay').value=result
            ">*
          </button>

          <button class="button" onclick="
            result=result+'7'
            document.querySelector('#resultDisplay').value=result
            ">7
          </button>

          <button class="button" onclick="
            result=result+'8'
            document.querySelector('#resultDisplay').value=result
            ">8
          </button>
          
          <button class="button" onclick="
            result=result+'/'
            document.querySelector('#resultDisplay').value=result
            ">/
          </button>
          
          <button class="button" onclick="
            result=eval(result);
            document.querySelector('#resultDisplay').value=result
            ">=
          </button>
          
          <button class="button" onclick="
            result=result+'9'
            document.querySelector('#resultDisplay').value=result
            ">9
          </button>

          <button class="button" onclick="
            result=result+'0'
            document.querySelector('#resultDisplay').value=result
            ">0
          </button>
          
          <button class="button" onclick="
            result=result+'.'
            document.querySelector('#resultDisplay').value=result
            ">.
          </button>
          
        </div>
      </div>
    </div>
  </main>

  <footer> </footer>

  <script src="script.js"> </script>

</body>

</html>
